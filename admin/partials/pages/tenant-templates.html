<section class="page template-page" data-page="tenant-templates">
  <div class="page-head template-page-head">
    <div>
      <p class="eyebrow">企业后台 / 展示配置</p>
      <h2>名片模板</h2>
      <p>统一配置企业成员名片的版式、品牌主色与视觉素材。</p>
    </div>
    <div class="page-head-actions">
      <button id="loadTemplates" type="button" class="secondary">刷新</button>
      <button id="createTemplate" type="button" class="secondary">新建模板</button>
      <button id="updateTemplate" type="button">保存模板</button>
    </div>
  </div>

  <div class="template-studio">
    <aside class="template-inspector">
      <form id="templateForm">
        <input id="templateId" type="hidden" />
        <section class="template-control-section">
          <div class="template-control-head"><div><strong>基本信息</strong><small>名称与启用状态</small></div></div>
          <div class="template-field-grid">
            <label><span>模板名称</span><input id="templateName" required /></label>
            <label><span>状态</span><select id="templateStatus"><option value="active">启用</option><option value="disabled">停用</option></select></label>
          </div>
        </section>

        <section class="template-control-section">
          <div class="template-control-head"><div><strong>版式</strong><small>与手机端使用同一配置</small></div></div>
          <div id="templateVariantChoices" class="template-variant-grid"></div>
          <input id="templateLayoutVariant" type="hidden" value="horizontal-business" />
        </section>

        <section class="template-control-section">
          <div class="template-control-head"><div><strong>品牌主色</strong><small>默认模板同时驱动企业主页</small></div><code id="templatePrimaryColorValue">#5272D6</code></div>
          <div id="templateColorChoices" class="template-color-row"></div>
          <div class="template-custom-color">
            <label for="templatePrimaryColor">HEX</label>
            <input id="templatePrimaryColor" value="#5272d6" maxlength="7" />
            <input id="templatePrimaryColorPicker" type="color" value="#5272d6" aria-label="选择自定义品牌色" />
          </div>
          <input id="templateSurfaceColor" type="hidden" value="#ffffff" />
        </section>

        <section class="template-control-section">
          <div class="template-control-head"><div><strong>视觉素材</strong><small>Logo、背景与照片版形象照</small></div></div>
          <div class="template-asset-field template-asset-field--inline">
            <div id="templateLogoPreview" class="template-asset-preview">未上传</div>
            <div><strong>企业 Logo</strong><span>建议透明底 PNG</span><div class="inline-actions"><button id="uploadTemplateLogo" type="button" class="secondary compact">上传</button><button id="clearTemplateLogo" type="button" class="ghost compact">清除</button></div></div>
          </div>
          <div class="template-asset-field">
            <div class="template-asset-label"><strong>模板背景</strong><span>建议比例 1.58:1</span></div>
            <div id="templateBackgroundPreview" class="template-asset-preview template-asset-preview--wide">使用版式默认背景</div>
            <div class="inline-actions"><button id="uploadTemplateBackground" type="button" class="secondary compact">上传背景</button><button id="clearTemplateBackground" type="button" class="ghost compact">恢复默认</button></div>
          </div>
          <input id="templateLogoUrl" type="hidden" />
          <input id="templateBackgroundUrl" type="hidden" />
          <label class="template-range-field"><span>背景透明度 <strong id="templateBackgroundOpacityValue">100%</strong></span><input id="templateBackgroundOpacity" type="range" min="0" max="100" step="5" value="100" /></label>
          <div id="templatePortraitField" class="template-asset-field template-asset-field--inline hidden">
            <div id="templatePortraitPreview" class="template-asset-preview">未上传</div>
            <div><strong>照片版形象照</strong><span>建议 500×500 以上</span><input id="templatePortraitUrl" type="hidden" /><div class="inline-actions"><button id="uploadTemplatePortrait" type="button" class="secondary compact">上传</button><button id="clearTemplatePortrait" type="button" class="ghost compact">清除</button></div></div>
          </div>
        </section>
      </form>
    </aside>

    <main class="template-canvas">
      <div class="template-canvas-head">
        <div><span>预览</span><strong id="templatePreviewName">请选择模板</strong></div>
        <span class="template-preview-live"><i></i>实时</span>
      </div>
      <section class="template-live-preview" aria-label="名片模板预览">
        <div id="templatePreview" class="template-preview-card template-preview-card--horizontal-business">
          <div class="template-preview-card__brand"><span id="templatePreviewLogo">企</span><strong id="templatePreviewCompany">企业名称</strong></div>
          <div class="template-preview-card__person"><strong>成员姓名</strong><span>职位名称</span><small>138 0000 0000</small></div>
        </div>
        <div class="template-preview-meta">
          <span id="templatePreviewState">保存后同步到企业成员名片</span>
          <button id="setDefaultTemplate" type="button" class="secondary compact">设为默认模板</button>
        </div>
      </section>
    </main>
  </div>
</section>
